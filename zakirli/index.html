<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ذاكرلي | Zakirli · Lecture Studio</title>
<meta name="theme-color" content="#0a1020">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bgglow"></div>
<header class="top">
  <div class="brand"><div class="logo">ذ</div><div><h1 data-i="title"></h1><p data-i="sub"></p></div></div>
  <div class="hbtns"><button id="langBtn" class="chip">EN</button><button id="installBtn" class="chip" hidden data-i="install"></button></div>
</header>
<nav class="tabs" id="tabs">
  <button data-tab="in" class="active" data-i="t_in"></button>
  <button data-tab="sum" data-i="t_sum"></button>
  <button data-tab="slides" data-i="t_slides"></button>
  <button data-tab="quiz" data-i="t_quiz"></button>
  <button data-tab="tr" data-i="t_tr"></button>
  <button data-tab="set" data-i="t_set"></button>
</nav>
<main>
<section id="tab-in" class="panel active">
  <div class="card">
    <h2 data-i="h_in"></h2>
    <div class="drop" id="drop"><div class="dicon">⬆</div><b data-i="drop1"></b><span data-i="drop2"></span>
      <label class="btn gold"><input type="file" id="file" accept=".txt,.md,.pdf,.pptx,.srt,.vtt" hidden><span data-i="upload"></span></label></div>
    <div id="slideInfo" class="chipline"></div>
    <div class="row"><button id="micBtn" class="btn" data-i="mic"></button>
      <select id="micLang"><option value="en-US">English</option><option value="ar-EG">العربية (مصر)</option></select>
      <button id="clearBtn" class="btn ghost" data-i="clear"></button></div>
    <textarea id="src" dir="auto" rows="10" data-ph="ph_src"></textarea>
    <div class="meta" id="srcMeta"></div>
  </div>
  <div class="card">
    <div class="grid3">
      <label><span data-i="outlang"></span><select id="outLang"><option value="auto" data-i="o_auto"></option><option value="en">English</option><option value="ar">العربية</option></select></label>
      <label><span data-i="length"></span><select id="len"><option value="s" data-i="l_s"></option><option value="m" selected data-i="l_m"></option><option value="l" data-i="l_l"></option></select></label>
      <label><span data-i="qcount"></span><select id="qn"><option>5</option><option selected>8</option><option>12</option><option>20</option></select></label>
    </div>
    <button id="goBtn" class="primary" data-i="go"></button>
    <button id="goSlides" class="primary alt" data-i="goslides"></button>
    <div id="status" class="status"></div>
  </div>
</section>
<section id="tab-sum" class="panel"><div class="card"><h2 data-i="t_sum"></h2><div id="sumOut" class="out empty" data-i="empty"></div>
  <div class="row"><button id="copySum" class="btn" data-i="copy"></button><button id="dlSum" class="btn" data-i="dlall"></button><button id="printBtn" class="btn" data-i="print"></button><button id="trSum" class="btn gold" data-i="trsum"></button></div></div></section>
<section id="tab-slides" class="panel"><div class="card"><h2 data-i="t_slides"></h2>
  <div class="row"><button id="goSlides2" class="btn gold" data-i="goslides"></button></div>
  <div id="slidesOut" class="out empty" data-i="empty_sl"></div></div></section>
<section id="tab-quiz" class="panel"><div class="card"><h2 data-i="t_quiz"></h2>
  <div class="seg"><button class="mode active" data-mode="mcq" data-i="m_mcq"></button><button class="mode" data-mode="essay" data-i="m_essay"></button><button class="mode" data-mode="flash" data-i="m_flash"></button></div>
  <div class="row"><button id="regen" class="btn" data-i="regen"></button></div>
  <div id="quizOut" class="out empty" data-i="empty"></div></div></section>
<section id="tab-tr" class="panel"><div class="card"><h2 data-i="t_tr"></h2>
  <div class="row"><select id="trDir"><option value="en|ar">English → العربية</option><option value="ar|en">العربية → English</option></select>
  <button id="trBtn" class="btn gold" data-i="translate"></button><button id="trLec" class="btn" data-i="trlec"></button></div>
  <textarea id="trIn" dir="auto" rows="6" data-ph="ph_tr"></textarea>
  <div id="trOut" class="out" dir="auto"></div><div class="status" id="trStatus"></div></div></section>
<section id="tab-set" class="panel"><div class="card"><h2 data-i="t_set"></h2>
  <p class="note" data-i="set_note"></p>
  <label class="blk"><span data-i="key"></span><input id="key" type="password" autocomplete="off" placeholder="AIza..."></label>
  <label class="blk"><span data-i="model"></span><input id="model" type="text" dir="ltr" value="gemini-flash-latest"></label>
  <div class="row"><button id="saveKey" class="btn gold" data-i="save"></button><button id="testKey" class="btn" data-i="test"></button><a class="btn ghost" target="_blank" rel="noopener" href="https://aistudio.google.com/apikey" data-i="getkey"></a></div>
  <div class="status" id="keyStatus"></div><p class="note" data-i="privacy"></p></div></section>
</main>
<script src="app.js" type="module"></script>
</body>
</html>
